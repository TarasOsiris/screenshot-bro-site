[phases.install]
cmds = ["npm ci --include=dev"]

[phases.build]
cmds = ["npm run build"]

[start]
# The on-boot script waits for the server, then pings IndexNow with the
# sitemap (no-op outside Coolify). `exec` keeps the server as the main process.
cmd = "sh -c 'node scripts/indexnow-on-boot.mjs & exec npm run start'"
